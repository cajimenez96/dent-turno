# Postgres local para desarrollo y pruebas. Las extensiones btree_gist y pg_trgm vienen en la imagen.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sto"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - sto-datos:/var/lib/postgresql/data
volumes:
  sto-datos:
